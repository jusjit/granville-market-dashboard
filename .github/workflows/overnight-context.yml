name: Overnight Context Log
on:
  schedule:
    # 14:45 UTC = 8:45am CST (13:45 during CDT) (Yahoo ES is ~10 min delayed, so the 8:30 bar exists by then)
    # 21:15 UTC = 3:15pm CST (RTH fill; 20:15 during CDT)
    # ⚠️ DST: on Mar 14 2027 (CDT) shift each -1h (13:45 / 20:15 UTC).
    - cron: '45 14 * * 1-5'
    - cron: '15 21 * * 1-5'
  workflow_dispatch:
    inputs:
      phase:
        description: 'morning or close'
        required: true
        default: 'morning'

jobs:
  overnight-log:
    runs-on: ubuntu-latest
    steps:
      - name: Log overnight context
        run: |
          PHASE="${{ github.event.inputs.phase }}"
          if [ -z "$PHASE" ]; then
            if [ "${{ github.event.schedule }}" = "45 14 * * 1-5" ]; then PHASE=morning; else PHASE=close; fi
          fi
          echo "phase=$PHASE"
          curl --fail-with-body -s --retry 2 --retry-delay 20 --max-time 60 -X POST \
            "https://private-market-dashboard.vercel.app/api/reference?type=overnight&phase=$PHASE" \
            -H "Authorization: Bearer ${{ secrets.SNAPSHOT_SECRET }}" \
            -w "\nHTTP %{http_code}\n"
