name: Reference Data Snapshots
on:
  schedule:
    # Every 4 hours during RTH (14:25 UTC = 9:25am EST, 22:05 UTC = 5:05pm EST)
    # Captures: pre-open (13:25) and post-close (21:05) weekdays
    # ⚠️ DST: on Mar 14 2027 (EDT) shift each hour -1 (13:25/21:05 UTC).
    - cron: '25 14 * * 1-5'  # ~9:25am EST pre-open
    - cron: '5 22 * * 1-5'   # ~5:05pm EST post-close
  workflow_dispatch:

jobs:
  reference-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Capture VIX futures + CME FedWatch snapshots
        run: |
          curl --fail-with-body -s -X POST "https://private-market-dashboard.vercel.app/api/reference" \
            -H "Authorization: Bearer ${{ secrets.SNAPSHOT_SECRET }}" \
            -w "\nHTTP %{http_code}\n"
