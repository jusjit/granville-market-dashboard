name: Vol Surface Snapshots
on:
  schedule:
    # Every 2h during RTH (14:30–21:05 UTC = 9:30am–4:05pm EST), weekdays.
    # ⚠️ DST: on Mar 14 2027 (EDT) shift each hour -1 (13/15/17/19/20 UTC).
    - cron: '30 14 * * 1-5'  # ~9:30am EST open
    - cron: '30 16 * * 1-5'  # ~11:30am EST
    - cron: '30 18 * * 1-5'  # ~1:30pm EST
    - cron: '30 20 * * 1-5'  # ~3:30pm EST
    - cron: '5 21 * * 1-5'   # ~4:05pm EST close
  workflow_dispatch:

jobs:
  vol-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Capture vol surface snapshot
        run: |
          curl --fail-with-body -s -X POST "https://private-market-dashboard.vercel.app/api/vol-history" \
            -H "Authorization: Bearer ${{ secrets.SNAPSHOT_SECRET }}" \
            -w "\nHTTP %{http_code}\n"
